<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ganeshGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2D1B69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bgGradient3)"/>
  
  <!-- Divine Aura -->
  <circle cx="150" cy="100" r="80" fill="url(#ganeshGradient)" opacity="0.3"/>
  <circle cx="150" cy="100" r="60" fill="url(#ganeshGradient)" opacity="0.2"/>
  
  <!-- Lord Ganesha Figure -->
  <g transform="translate(150,110)">
    <!-- Main body -->
    <ellipse cx="0" cy="20" rx="30" ry="40" fill="#FF6B35" opacity="0.8"/>
    
    <!-- Large belly -->
    <circle cx="0" cy="15" r="25" fill="#FFD700" opacity="0.9"/>
    
    <!-- Head -->
    <circle cx="0" cy="-25" r="20" fill="#FFA500"/>
    
    <!-- Elephant ears -->
    <ellipse cx="-25" cy="-20" rx="12" ry="18" fill="#FF6B35" opacity="0.8"/>
    <ellipse cx="25" cy="-20" rx="12" ry="18" fill="#FF6B35" opacity="0.8"/>
    
    <!-- Trunk -->
    <path d="M -5,-15 Q -15,-5 -20,5 Q -25,15 -15,20 Q -10,25 -5,20" stroke="#FFA500" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="-8" cy="-25" r="2" fill="#000"/>
    <circle cx="8" cy="-25" r="2" fill="#000"/>
    
    <!-- Crown -->
    <path d="M -20,-40 L 0,-50 L 20,-40 L 15,-35 L -15,-35 Z" fill="#FFD700"/>
    <circle cx="0" cy="-42" r="3" fill="#FF0000"/> <!-- Crown jewel -->
    
    <!-- Four Arms -->
    <!-- Left arms -->
    <ellipse cx="-35" cy="-5" rx="8" ry="22" fill="#FF6B35" opacity="0.7" transform="rotate(-15)"/>
    <ellipse cx="-30" cy="20" rx="8" ry="20" fill="#FF6B35" opacity="0.7" transform="rotate(-30)"/>
    
    <!-- Right arms -->
    <ellipse cx="35" cy="-5" rx="8" ry="22" fill="#FF6B35" opacity="0.7" transform="rotate(15)"/>
    <ellipse cx="30" cy="20" rx="8" ry="20" fill="#FF6B35" opacity="0.7" transform="rotate(30)"/>
    
    <!-- Objects in hands -->
    <!-- Axe (Parashu) -->
    <g transform="translate(-40,-15) rotate(-15)">
      <rect x="0" y="0" width="2" height="15" fill="#8B4513"/>
      <path d="M -3,-2 L 5,-2 L 3,3 L -1,3 Z" fill="#C0C0C0"/>
    </g>
    
    <!-- Lotus -->
    <g transform="translate(38,-10)">
      <ellipse cx="0" cy="0" rx="4" ry="2" fill="#FF69B4"/>
      <ellipse cx="0" cy="0" rx="3" ry="1.5" fill="#FFB6C1"/>
    </g>
    
    <!-- Modak (sweet) -->
    <g transform="translate(-35,25)">
      <path d="M 0,-3 Q -3,0 0,3 Q 3,0 0,-3" fill="#FFFF8C"/>
    </g>
    
    <!-- Blessing hand (Abhaya Mudra) -->
    <circle cx="35" cy="25" r="4" fill="#FFD700" opacity="0.8"/>
    
    <!-- Sacred thread -->
    <path d="M -15,-10 Q 0,0 15,-10" stroke="#FFD700" stroke-width="2" fill="none"/>
    
    <!-- Tilaka on forehead -->
    <ellipse cx="0" cy="-30" rx="2" ry="4" fill="#FF0000"/>
  </g>
  
  <!-- Mouse (Vahana) -->
  <g transform="translate(200,160)">
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#696969"/>
    <circle cx="-8" cy="-2" r="4" fill="#808080"/>
    <circle cx="-10" cy="-3" r="1" fill="#000"/> <!-- Eye -->
    <path d="M 8,0 Q 15,0 12,3" stroke="#696969" stroke-width="2" fill="none"/> <!-- Tail -->
  </g>
  
  <!-- Modaks scattered around -->
  <g opacity="0.7">
    <path d="M 80,50 Q 77,53 80,56 Q 83,53 80,50" fill="#FFFF8C"/>
    <path d="M 220,60 Q 217,63 220,66 Q 223,63 220,60" fill="#FFFF8C"/>
    <path d="M 60,140 Q 57,143 60,146 Q 63,143 60,140" fill="#FFFF8C"/>
    <path d="M 240,130 Q 237,133 240,136 Q 243,133 240,130" fill="#FFFF8C"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.6">
    <!-- Lotus petals -->
    <ellipse cx="70" cy="70" rx="8" ry="4" fill="#FF69B4" transform="rotate(30)"/>
    <ellipse cx="230" cy="80" rx="8" ry="4" fill="#FF69B4" transform="rotate(-30)"/>
    
    <!-- Divine lights -->
    <circle cx="40" cy="40" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="50" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="170" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="150" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Sacred symbols and mantras -->
  <text x="20" y="30" font-family="serif" font-size="16" fill="#FFD700" opacity="0.8">गं</text>
  <text x="260" y="180" font-family="serif" font-size="16" fill="#FFD700" opacity="0.8">गणपति</text>
  <text x="130" y="25" font-family="serif" font-size="18" fill="#FFD700" opacity="0.9">ॐ</text>
  
  <!-- Auspicious swastika -->
  <g transform="translate(40,160)" opacity="0.6">
    <path d="M -3,0 L 3,0 M 0,-3 L 0,3 M 3,0 L 3,-3 M 0,3 L -3,3" stroke="#FFD700" stroke-width="1" fill="none"/>
  </g>
</svg>