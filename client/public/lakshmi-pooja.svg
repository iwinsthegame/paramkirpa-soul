<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lakshmiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D1B69;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lotusGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bgGradient2)"/>
  
  <!-- Divine Aura -->
  <circle cx="150" cy="90" r="70" fill="url(#lakshmiGradient)" opacity="0.3"/>
  <circle cx="150" cy="90" r="50" fill="url(#lakshmiGradient)" opacity="0.2"/>
  
  <!-- Large Lotus Base -->
  <g transform="translate(150,160)">
    <!-- Lotus petals -->
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="url(#lotusGradient)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="url(#lotusGradient)" opacity="0.9" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="url(#lotusGradient)" opacity="0.9" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="url(#lotusGradient)" opacity="0.9" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="url(#lotusGradient)" opacity="0.9" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="url(#lotusGradient)" opacity="0.9" transform="rotate(150)"/>
    <!-- Lotus center -->
    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
  </g>
  
  <!-- Goddess Lakshmi Figure -->
  <g transform="translate(150,90)">
    <!-- Main body -->
    <ellipse cx="0" cy="20" rx="20" ry="35" fill="#FFD700" opacity="0.8"/>
    
    <!-- Head -->
    <circle cx="0" cy="-15" r="12" fill="#FFA500"/>
    
    <!-- Crown/Hair -->
    <path d="M -12,-25 Q 0,-35 12,-25 Q 8,-20 -8,-20 Z" fill="#FFD700"/>
    
    <!-- Four Arms -->
    <!-- Left arms -->
    <ellipse cx="-25" cy="0" rx="6" ry="20" fill="#FFD700" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="-20" cy="15" rx="6" ry="18" fill="#FFD700" opacity="0.7" transform="rotate(-10)"/>
    
    <!-- Right arms -->
    <ellipse cx="25" cy="0" rx="6" ry="20" fill="#FFD700" opacity="0.7" transform="rotate(20)"/>
    <ellipse cx="20" cy="15" rx="6" ry="18" fill="#FFD700" opacity="0.7" transform="rotate(10)"/>
    
    <!-- Symbols in hands -->
    <!-- Lotus flowers in upper hands -->
    <g transform="translate(-30,-10)">
      <ellipse cx="0" cy="0" rx="4" ry="2" fill="#FF69B4"/>
      <ellipse cx="0" cy="0" rx="3" ry="1.5" fill="#FFB6C1"/>
    </g>
    <g transform="translate(30,-10)">
      <ellipse cx="0" cy="0" rx="4" ry="2" fill="#FF69B4"/>
      <ellipse cx="0" cy="0" rx="3" ry="1.5" fill="#FFB6C1"/>
    </g>
    
    <!-- Blessing mudra and coins -->
    <circle cx="-25" cy="20" r="3" fill="#FFD700"/> <!-- Coin -->
    <path d="M 20,20 Q 25,15 30,20 Q 25,25 20,20" fill="#FFD700"/> <!-- Blessing hand -->
    
    <!-- Ornaments -->
    <circle cx="0" cy="-5" r="2" fill="#FFD700"/> <!-- Necklace -->
    <circle cx="-3" cy="-3" r="1" fill="#FFD700"/>
    <circle cx="3" cy="-3" r="1" fill="#FFD700"/>
  </g>
  
  <!-- Two elephants on sides -->
  <g transform="translate(80,100)">
    <ellipse cx="0" cy="10" rx="15" ry="20" fill="#8B4513" opacity="0.8"/>
    <circle cx="0" cy="-5" r="10" fill="#8B4513" opacity="0.8"/>
    <ellipse cx="-8" cy="-2" rx="3" ry="8" fill="#8B4513" opacity="0.8"/> <!-- Trunk -->
    <!-- Water stream -->
    <path d="M -8,5 Q 15,0 35,-5" stroke="#87CEEB" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  
  <g transform="translate(220,100)">
    <ellipse cx="0" cy="10" rx="15" ry="20" fill="#8B4513" opacity="0.8"/>
    <circle cx="0" cy="-5" r="10" fill="#8B4513" opacity="0.8"/>
    <ellipse cx="8" cy="-2" rx="3" ry="8" fill="#8B4513" opacity="0.8"/> <!-- Trunk -->
    <!-- Water stream -->
    <path d="M 8,5 Q -15,0 -35,-5" stroke="#87CEEB" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Floating gold coins -->
  <g opacity="0.8">
    <circle cx="60" cy="60" r="4" fill="#FFD700">
      <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="70" r="4" fill="#FFD700">
      <animate attributeName="cy" values="70;60;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="40" r="3" fill="#FFD700">
      <animate attributeName="cy" values="40;30;40" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="45" r="3" fill="#FFD700">
      <animate attributeName="cy" values="45;35;45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Decorative lotus petals -->
  <g opacity="0.6">
    <ellipse cx="50" cy="120" rx="6" ry="3" fill="#FF69B4" transform="rotate(45)"/>
    <ellipse cx="250" cy="130" rx="6" ry="3" fill="#FF69B4" transform="rotate(-45)"/>
    <ellipse cx="70" cy="180" rx="6" ry="3" fill="#FF69B4" transform="rotate(30)"/>
    <ellipse cx="230" cy="170" rx="6" ry="3" fill="#FF69B4" transform="rotate(-30)"/>
  </g>
  
  <!-- Sacred symbols -->
  <text x="20" y="25" font-family="serif" font-size="14" fill="#FFD700" opacity="0.8">श्री</text>
  <text x="260" y="25" font-family="serif" font-size="14" fill="#FFD700" opacity="0.8">लक्ष्मी</text>
  <text x="130" y="25" font-family="serif" font-size="18" fill="#FFD700" opacity="0.9">ॐ</text>
</svg>