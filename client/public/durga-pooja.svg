<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="durgaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bgGradient)"/>
  
  <!-- Divine Aura -->
  <circle cx="150" cy="100" r="80" fill="url(#durgaGradient)" opacity="0.3"/>
  <circle cx="150" cy="100" r="60" fill="url(#durgaGradient)" opacity="0.2"/>
  
  <!-- Goddess Durga Figure -->
  <g transform="translate(150,100)">
    <!-- Main body -->
    <ellipse cx="0" cy="20" rx="25" ry="40" fill="#FF6B35" opacity="0.8"/>
    
    <!-- Head -->
    <circle cx="0" cy="-20" r="15" fill="#F7931E"/>
    
    <!-- Crown -->
    <path d="M -15,-30 L 0,-40 L 15,-30 L 10,-25 L -10,-25 Z" fill="#FFD700"/>
    
    <!-- Multiple Arms (8 arms) -->
    <!-- Left arms -->
    <ellipse cx="-35" cy="-5" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(-30)"/>
    <ellipse cx="-40" cy="10" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(-45)"/>
    <ellipse cx="-35" cy="25" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(-60)"/>
    <ellipse cx="-25" cy="35" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(-75)"/>
    
    <!-- Right arms -->
    <ellipse cx="35" cy="-5" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(30)"/>
    <ellipse cx="40" cy="10" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(45)"/>
    <ellipse cx="35" cy="25" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(60)"/>
    <ellipse cx="25" cy="35" rx="8" ry="25" fill="#FF6B35" opacity="0.7" transform="rotate(75)"/>
    
    <!-- Weapons in hands -->
    <!-- Trident -->
    <path d="M -45,-15 L -42,-25 M -45,-15 L -48,-25 M -45,-15 L -45,-25" stroke="#FFD700" stroke-width="2" fill="none"/>
    
    <!-- Sword -->
    <rect x="40" y="-20" width="3" height="15" fill="#FFD700"/>
    
    <!-- Conch -->
    <ellipse cx="-35" cy="40" rx="4" ry="6" fill="#FFD700"/>
    
    <!-- Lotus -->
    <g transform="translate(30,40)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#FFB6C1"/>
      <ellipse cx="0" cy="0" rx="2" ry="1" fill="#FF69B4"/>
    </g>
  </g>
  
  <!-- Lion (Vahana) -->
  <g transform="translate(150,160)">
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#D2691E"/>
    <circle cx="-20" cy="-8" r="8" fill="#CD853F"/>
    <path d="M -25,-8 Q -30,-12 -28,-15 Q -26,-12 -25,-8" fill="#F4A460"/> <!-- Mane -->
  </g>
  
  <!-- Decorative Elements -->
  <g opacity="0.6">
    <!-- Lotus petals around -->
    <ellipse cx="80" cy="50" rx="8" ry="4" fill="#FF69B4" transform="rotate(30)"/>
    <ellipse cx="220" cy="60" rx="8" ry="4" fill="#FF69B4" transform="rotate(-30)"/>
    <ellipse cx="70" cy="150" rx="8" ry="4" fill="#FF69B4" transform="rotate(60)"/>
    <ellipse cx="230" cy="140" rx="8" ry="4" fill="#FF69B4" transform="rotate(-60)"/>
    
    <!-- Divine lights -->
    <circle cx="50" cy="40" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="80" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="180" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="160" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Sacred OM -->
  <text x="20" y="30" font-family="serif" font-size="16" fill="#FFD700" opacity="0.7">ॐ</text>
  <text x="260" y="180" font-family="serif" font-size="16" fill="#FFD700" opacity="0.7">ॐ</text>
</svg>